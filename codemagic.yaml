workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate code (json_serializable)
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        script: flutter analyze

      - name: Run tests
        script: flutter test

      - name: Build Android debug APK
        script: flutter build apk --debug

      - name: Build iOS (no codesign)
        script: flutter build ios --debug --no-codesign

    artifacts:
      - build/**/outputs/**/*.apk
      - build/ios/iphoneos/*.app

    publishing:
      email:
        recipients:
          - choi0250655@gmail.com
        notify:
          success: false
          failure: true